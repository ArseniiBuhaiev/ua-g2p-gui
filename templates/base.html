<!DOCTYPE html>
<html lang="uk" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Phonetics Lab UA{% endblock %}</title>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg custom-navbar bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center me-4" href="/">
                <img src="{{ url_for('static', filename='icon.png') }}" alt="Icon" width="48" height="48" class="me-2">
                <span class="brand-text">PHONETICS LAB UA</span>
            </a>

            <div class="navbar-nav me-auto">
                <a class="nav-link {% if request.path == '/g2p' %}active{% endif %}" href="/g2p">
                    ТРАНСКРИПЦІЯ
                </a>
            </div>
    
            <div class="ms-auto d-flex align-items-center gap-2">
                {% if request.path == '/g2p' %}
                <div class="btn-group btn-group-sm me-2">
                    <button class="btn btn-outline-secondary" onclick="changeFontSize(-2)">A-</button>
                    <button class="btn btn-outline-secondary" onclick="changeFontSize(2)">A+</button>
                </div>
                {% endif %}
                <button id="themeToggle" class="btn btn-sm btn-outline-secondary">🌓 Тема</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-body-tertiary">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <a href="https://philology.knu.ua/" class="footer-link" target="_blank">
                Катедра української мови та прикладної лінгвістики
            </a>
            <a href="https://github.com/ArseniiBuhaiev" class="footer-link" target="_blank">GitHub</a>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
